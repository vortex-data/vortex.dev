name: Bench checks
description: >-
  bench's full check suite: infrastructure trust policies, the parity check's
  tests, format, lint, build, the migration-runner and deployment-verification
  tests, and bench's tests with their Postgres integration suite. ci.yml's
  "Bench: format, lint, build, test" job runs it on every change that can
  affect bench. Run it after a checkout.

runs:
  using: composite
  steps:
    - name: Check infrastructure trust policies offline
      shell: bash
      run: |
        bash -n infra/provision.sh
        python3 -m unittest discover -s infra/tests -v

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      with:
        bun-version: 1.4.3

    # Next.js, Vitest and the deployment tests run on Node.
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        # The repository-wide Node pin (see CLAUDE.md "Node version").
        node-version-file: .nvmrc

    # Bun's package store, keyed on the lockfile, as in ci.yml. The restore
    # key falls back to any earlier cache from this OS.
    - name: Cache Bun install cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # The parity check's own logic: request planning, the expected statuses
    # and the comparisons. The explicit path keeps `bun test` from also
    # collecting bench's Vitest files.
    - name: Test the parity check
      shell: bash
      run: bun test scripts/parity/compare-api.test.ts

    # Biome over all of bench's code (its routes, components and library, the
    # parity check and the deployment check) with the root biome.json, in CI
    # mode: format and lint, no writes. Import sorting is off for bench (see
    # CLAUDE.md "bench"). On a bench-only change ci.yml skips the root
    # `check:ci`, so this keeps bench's files checked. `bun run` uses the
    # pinned Biome and never downloads one.
    - name: Format and lint
      shell: bash
      run: >-
        bun run biome ci src/bench 'src/app/(bench)' src/css.d.ts scripts/parity
        scripts/verify-web-deploy.mjs scripts/verify-web-deploy.test.mjs vitest.config.ts

    # The app's build, both sites. `next build` must succeed without a
    # reachable database (every bench page and route is request-rendered), so
    # no BENCH_DB_* env vars are provided here on purpose. It also type-checks
    # the whole app.
    - name: Build
      shell: bash
      run: bun run build

    # The Postgres integration suite runs on Docker here. Locally it skips when there
    # is neither Docker nor BENCH_TEST_DATABASE_URL; with CI=true the test harness
    # fails the suite instead. This step fails sooner, with a plainer cause.
    - name: Require Docker for the integration suite
      shell: bash
      run: docker info > /dev/null

    # The migration-runner tests and the integration suite both run
    # db/migrate-schema.py through uv.
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        enable-cache: false

    # uv resolves the runner's Python dependencies when it runs. Give them the
    # repository's 7-day cooldown (see CLAUDE.md "Supply chain hardening").
    - name: Set the uv cooldown
      shell: bash
      run: echo "UV_EXCLUDE_NEWER=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

    - name: Test migration runner
      shell: bash
      working-directory: db
      run: uv run --no-project --with 'psycopg[binary]>=3.2' python -m unittest discover -s tests -v

    - name: Test deployment verification
      shell: bash
      run: node --test scripts/verify-web-deploy.test.mjs

    - name: Test
      shell: bash
      run: bun run test:bench
