name: Bench checks
description: >-
  bench's full check suite: infrastructure trust policies, the parity check's
  tests, format, lint, build, the migration-runner and deployment-verification
  tests, and the web tests with their Postgres integration suite. Bench CI runs it on every change to bench,
  and bench-deploy runs it on the exact commit it deploys. Run it after a
  checkout.

runs:
  using: composite
  steps:
    - name: Check infrastructure trust policies offline
      shell: bash
      working-directory: bench
      run: |
        bash -n infra/provision.sh
        python3 -m unittest discover -s infra/tests -v

    # bench/web is a member of the root Bun workspace: Bun installs both apps
    # from the one bun.lock and runs bench's scripts.
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      with:
        bun-version: 1.4.3

    # Next.js, Vitest and the deployment tests run on Node.
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        # The repository-wide Node pin (see CLAUDE.md "Node version"). Keep
        # @types/node in bench/web/package.json on the same major.
        node-version-file: .nvmrc

    # Bun's package store, keyed on the lockfile, as in ci.yml. The restore
    # key falls back to any earlier cache from this OS.
    - name: Cache Bun install cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    # At the root, where bun.lock and bunfig.toml live. This installs both apps.
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # The parity check's own logic: request planning, the expected statuses
    # and the comparisons. The explicit path keeps `bun test` from also
    # collecting bench's Vitest files.
    - name: Test the parity check
      shell: bash
      run: bun test bench/scripts/parity/compare-api.test.ts

    # Biome over all of bench (web, scripts, parity harness) with the root
    # biome.json, in CI mode: format and lint, no writes. Import sorting is off
    # for bench (see bench/AGENTS.md). It replaces the bench/web `format:check`
    # and `lint` scripts, which cover only bench/web and would leave
    # bench/scripts unchecked on bench-only changes, where ci.yml skips the
    # root `check:ci`. `bun run` uses the workspace's pinned Biome and never
    # downloads one.
    - name: Format and lint
      shell: bash
      run: bun run biome ci bench

    # `next build` must succeed without a reachable database (every page and route
    # is request-rendered), so no BENCH_DB_* env vars are provided here on purpose.
    - name: Build
      shell: bash
      run: bun run --cwd bench/web build

    # The Postgres integration suite runs on Docker here. Locally it skips when there
    # is neither Docker nor BENCH_TEST_DATABASE_URL; with CI=true the test harness
    # fails the suite instead. This step fails sooner, with a plainer cause.
    - name: Require Docker for the integration suite
      shell: bash
      run: docker info > /dev/null

    # The migration-runner tests and the web integration suite both run
    # bench/scripts/migrate-schema.py through uv.
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        enable-cache: false

    # uv resolves the runner's Python dependencies when it runs. Give them the
    # repository's 14-day cooldown (see CLAUDE.md "Supply chain hardening").
    - name: Set the uv cooldown
      shell: bash
      run: echo "UV_EXCLUDE_NEWER=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

    - name: Test migration runner
      shell: bash
      working-directory: bench
      run: uv run --no-project --with 'psycopg[binary]>=3.2' python -m unittest discover -s scripts/tests -v

    - name: Test deployment verification
      shell: bash
      working-directory: bench
      run: node --test scripts/tests/verify-web-deploy.test.mjs

    - name: Test
      shell: bash
      run: bun run --cwd bench/web test
