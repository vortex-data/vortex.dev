version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    # Wait 14 days after a release before proposing a bump. Avoids dragging in
    # day-old versions that get yanked or hot-patched within their first week.
    cooldown:
      default-days: 14
    # Logical groups so related bumps land together. Patterns are matched
    # against package names; a package can only belong to one group, so order
    # matters (more-specific groups first).
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      content-pipeline:
        patterns:
          - "remark-*"
          - "rehype-*"
          - "@next/mdx"
          - "@mdx-js/*"
          - "react-markdown"
          - "velite"
      lint-format:
        patterns:
          - "@biomejs/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types:
          - minor
          - patch
          - major
    labels:
      - dependencies
      - github-actions
