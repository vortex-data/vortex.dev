name: AI review recheck

# Runs the AI cross-review gate (ai-review.yml) again when Codex or a member
# comments on a pull request or reviews it. Codex posts its findings as a
# review and edits its summary comment, so this is how the gate sees a
# finished Codex review. A member can also comment to recheck the gate, for
# example after resolving a thread by hand.
#
# issue_comment runs with a write token, also for fork pull requests, so this
# workflow runs main's copy of the gate and never checks out the pull
# request's code. It reads the pull request only through the API.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, dismissed]

# Nothing by default; the job asks for what it uses.
permissions: {}

jobs:
  gate:
    name: Gate
    # pull_request_review gives a fork pull request a read-only token, which
    # cannot set a status, so those runs skip forks.
    if: >-
      (github.event_name == 'pull_request_review' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # The same group as ai-review.yml's gate.
    concurrency:
      group: ai-review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Evaluate the reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bun scripts/ai-review-gate.ts gate
