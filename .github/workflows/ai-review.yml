name: AI review

# The AI cross-review gate. Every pull request needs a Codex review of its
# head commit. A pull request that Codex helped write (its footer or its
# author names Codex) also needs a Claude review of its head commit. The gate
# writes the result as the commit status `AI cross-review` on the head commit,
# and the `main` ruleset requires that status, so auto-merge waits until both
# reviews are clean. scripts/ai-review-gate.ts holds the rules; CLAUDE.md
# ("AI review") explains them.
#
# The result is a commit status, not this job's check, because a comment or a
# review starts this workflow on main's commit, and a check from that run
# would not attach to the pull request's head commit.
#
# Required setup: the repository secret ANTHROPIC_API_KEY (claude.yml uses it
# too), and the Codex GitHub app on the repository.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  # Codex posts its findings as a review and edits its summary comment.
  pull_request_review:
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]

# Nothing by default; each job asks for what it uses.
permissions: {}

jobs:
  gate:
    name: Gate
    # Fork pull requests get a read-only token on pull_request and
    # pull_request_review, which cannot set a status, so those runs skip
    # them. A comment from Codex or a member reruns the gate for any pull
    # request, with main's workflow and a write token; the gate reads the
    # pull request through the API and never runs its code.
    if: >-
      ((github.event_name == 'pull_request' || github.event_name == 'pull_request_review') &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # One gate per pull request at a time. A newer event replaces a waiting
    # run, so the last run sets the status from the newest state.
    concurrency:
      group: ai-review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Set the `AI cross-review` status.
      statuses: write
      # Post `@codex review` when Codex has not reviewed the head commit.
      issues: write
      pull-requests: read
    outputs:
      head_sha: ${{ steps.gate.outputs.head_sha }}
      claude_due: ${{ steps.gate.outputs.claude_due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4

      # No `bun install`: the script uses only Bun and Node built-ins, and
      # this job holds a write token.
      - name: Test the gate
        run: bun test scripts/ai-review-gate.test.ts

      - name: Evaluate the reviews
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bun scripts/ai-review-gate.ts gate

  claude-review:
    name: Claude review
    needs: gate
    # Only a pull_request event starts a review: it is the one event that
    # carries a same-repository pull request's own head commit.
    if: needs.gate.outputs.claude_due == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # A push cancels the review of the commit it replaced.
    concurrency:
      group: ai-review-claude-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      id-token: write
    env:
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # A pending status tells later gate runs that a review is under way, so
      # they do not start a second one.
      - name: Mark the review as started
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}"
          -f state=pending -f context="AI cross-review / Claude"
          -f description="Claude is reviewing the head commit."
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # The default ref: on pull_request, the merge commit, which holds the
      # head commit's changes. Claude reads the diff with `gh pr diff`, and
      # the statuses go on HEAD_SHA. Naming the head commit here would make
      # CodeQL flag an untrusted checkout, because this workflow also runs on
      # issue_comment with a write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4

      # A failed or cancelled review leaves no verdict, and the next step
      # turns that into a failure, so this step may fail without stopping
      # the job.
      - name: Review with Claude
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Codex can push to a pull request it opened.
          allowed_bots: chatgpt-codex-connector[bot]
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD COMMIT: ${{ needs.gate.outputs.head_sha }}

            You are the second reviewer for this pull request. Codex helped to
            write it. Your review decides if the pull request can merge.

            1. Read CLAUDE.md for the rules of this repository.
            2. Read the diff with `gh pr diff`. Read `gh pr view --comments`
               to see the earlier findings and replies.
            3. Find real problems in the head commit: incorrect behavior,
               security problems, data loss, and broken CLAUDE.md rules. Do
               not report style preferences.
            4. Give each finding one priority:
               - P0: it breaks production, loses data, or opens a security
                 hole.
               - P1: it is a bug or a broken rule that must be fixed before
                 merge.
               - P2: it should be fixed, but it does not block the merge.
               - P3: a small improvement.
            5. Post each new finding as an inline comment. Start the comment
               with its priority, for example "**P1**". If an open comment
               already reports a finding, do not post it again.
            6. Post one summary comment with `gh pr comment`.
            7. In your structured output, set `blocking` to the number of P0
               and P1 findings that the head commit still has, including
               findings from earlier comments. Set `summary` to one sentence.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"integer","minimum":0},"summary":{"type":"string"}},"required":["blocking","summary"],"additionalProperties":false}'

      - name: Record the verdict
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLAUDE_VERDICT: ${{ steps.claude.outputs.structured_output }}
        run: bun scripts/ai-review-gate.ts claude-verdict

      # The verdict changed the inputs, so evaluate again. A status set with
      # this job's token starts no workflow, so the gate job would not rerun
      # on its own.
      - name: Evaluate the reviews
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/ai-review-gate.ts gate
