name: Bench CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: correctness CI only reads the checkout — no writes, no creds.
permissions:
  contents: read

# Cancel stale runs on the same ref: a newer push to a branch (or a newer sync
# to a PR) supersedes the in-flight run. The group uses a stable literal slug
# rather than `${{ github.workflow }}` so renaming the workflow's `name:` cannot
# orphan in-flight runs.
concurrency:
  group: bench-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in lockstep with `packageManager` in bench/web/package.json.
  PNPM_VERSION: "11.5.2"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bench: ${{ steps.paths.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        uses: ./.github/actions/changed-paths

  web:
    name: "Bench: format, lint, build, test"
    needs: changes
    # Skipped, which counts as passing, when nothing under bench/ changed. If
    # the path check itself fails, run anyway rather than skip.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.bench == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bench/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check infrastructure trust policies offline
        working-directory: bench
        run: |
          bash -n infra/provision.sh
          python3 -m unittest discover -s infra/tests -v

      # pnpm must exist before setup-node so its `cache: pnpm` can resolve the store.
      - name: Install pnpm
        run: npm install -g "pnpm@${PNPM_VERSION}"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # The repository-wide Node pin (see CLAUDE.md "Node version"). Keep
          # @types/node in bench/web/package.json on the same major.
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: bench/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # `next build` must succeed without a reachable database (every page and route
      # is request-rendered), so no BENCH_DB_* env vars are provided here on purpose.
      - name: Build
        run: pnpm build

      # testcontainers self-skips the Postgres integration suite when no Docker daemon
      # is available (a local-dev convenience); in CI that would silently drop the only
      # Postgres integration coverage, so fail loudly if the daemon is missing.
      - name: Require Docker for the integration suite
        run: docker info > /dev/null

      - name: Test
        run: pnpm test
