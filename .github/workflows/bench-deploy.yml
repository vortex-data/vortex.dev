#
# Deploy bench (bench/web) to its own Vercel project, `benchmarks-website`,
# with the Vercel CLI. Git integration is off on that project, so these runs
# are its only deploys, and they never touch the `vortex` project that serves
# the marketing site. The project's Root Directory must be `bench/web`: the CLI
# runs from the repository root and uses the pulled project settings to find
# the app.
#
# Triggers: a production deploy on every push to main that touches bench/ or
# the root files bench/web builds from (package.json, bun.lock, bunfig.toml,
# tsconfig.base.json), or the Vercel CLI in .github/vercel-cli; a preview deploy
# on every same-repo pull request that does, with the preview URL posted back to
# the PR as a sticky comment; and `workflow_dispatch` for manual preview or
# production runs. Fork PRs are skipped, since they can't read VERCEL_TOKEN.
#
# Every pull request starts this workflow, and the `changes` job skips the rest
# when the PR can't affect bench (see .github/actions/changed-paths). A skipped
# job reports success, so "Bench: deploy" can be a required check. Pushes keep
# their `paths` filter: a push run that started only to skip would still queue
# in the production concurrency group, and GitHub cancels the run already
# pending there, which could be a real production deploy.
#
# The job runs in the `bench-production` or `bench-preview` GitHub environment.
# Each holds VERCEL_TOKEN, a token scoped to the `benchmarks-website` project,
# and `bench-production` only accepts runs from main. The environment also gives
# the PR its "View deployment" button. The job is skipped while the
# BENCH_VERCEL_PROJECT_ID variable is unset.

name: Bench Deploy

on:
  push:
    branches: [main]
    paths:
      - 'bench/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'tsconfig.base.json'
      - '.github/vercel-cli/**'
      - '.github/workflows/bench-deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Vercel target environment"
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  # Push and manual production runs share one queue and never cancel an active
  # run, so each promotion finishes its verification before the next starts. A
  # newer preview run can cancel an older preview of the same event and ref.
  group: ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'bench-deploy-production' || format('bench-deploy-preview-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' && inputs.environment != 'production' }}

permissions:
  contents: read
  # The sticky preview-URL comment.
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.BENCH_VERCEL_PROJECT_ID }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bench: ${{ steps.paths.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        uses: ./.github/actions/changed-paths

  # Run bench's checks on the exact commit this run deploys. main takes squash
  # merges and does not require a branch to be up to date before it merges, so
  # the pushed commit itself is never checked before it lands, and Bench CI on
  # main runs beside this workflow, not before it.
  checks:
    name: Check the deployed commit
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Skipped, which counts as passing, when the change can't affect bench. If
    # the path check itself fails, run anyway rather than skip. The deploy job
    # needs this one, so it skips with it.
    if: >-
      !cancelled() &&
      (needs.changes.result != 'success' || needs.changes.outputs.bench == 'true') &&
      vars.BENCH_VERCEL_PROJECT_ID != '' && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Bench checks
        uses: ./.github/actions/bench-checks

  deploy:
    name: "Bench: deploy"
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Fork PRs have no access to VERCEL_TOKEN, and we do not auto-deploy untrusted
    # code; same-repo PRs, pushes, and manual dispatches run normally. Until the
    # bench Vercel project is configured here, the job stays off.
    if: >-
      vars.BENCH_VERCEL_PROJECT_ID != '' && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    # push to main => production; pull_request => preview; manual dispatch => the
    # input. `environment` can't read the job's `env`, so TARGET repeats this
    # expression; keep the two in step.
    environment:
      name: bench-${{ (github.event_name == 'push' || inputs.environment == 'production') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      TARGET: ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'production' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # `vercel build` below builds ON THE RUNNER (not Vercel's infra). It runs
      # bench/web's install command from vercel.json and `next build`, so Bun and
      # Node must be on PATH. Mirror the bench-checks setup.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          # The prebuilt build runs on the Node major its functions run on:
          # 24 until the benchmarks-website project moves to 26.x (see
          # CLAUDE.md, bench/). Then return to `node-version-file: .nvmrc`.
          node-version: "24"

      # .github/vercel-cli pins the CLI and locks its whole dependency tree. Its
      # overrides patch advisories in dependencies the CLI pins (see CLAUDE.md
      # "bench advisories"). This job holds VERCEL_TOKEN, so lifecycle scripts
      # stay off.
      - name: Install Vercel CLI
        working-directory: .github/vercel-cli
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # Production verification probes the public domain, so it has to be set.
      - name: Require a public production verification URL
        if: env.TARGET == 'production'
        env:
          PROD_URL: ${{ vars.BENCH_SITE_BASE_URL }}
        run: |
          [[ "${PROD_URL}" == https://* ]] || { echo "::error::Set BENCH_SITE_BASE_URL to the public HTTPS production URL."; exit 1; }

      # bench/web is a member of the root Bun workspace, so install from the
      # root: bun.lock is there, and bunfig.toml's cooldown and linker apply.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment="${TARGET}"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # next.config.js embeds this, so /api/health reports the deployed commit.
          BENCH_BUILD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ "${TARGET}" = "production" ]; then
            vercel build --prod
          else
            vercel build
          fi

      - name: Deploy (prebuilt)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -Eeuo pipefail
          # The JSON's shape depends on whether the CLI thinks it is
          # non-interactive, so say so: then .deployment.url is the full URL.
          args=(deploy --prebuilt --non-interactive --format json)
          if [ "${TARGET}" = "production" ]; then
            args+=(--prod)
          fi
          url="$(vercel "${args[@]}" | jq -er '.deployment.url')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          printf 'Deployed: %s\n' "$url"

      # On a pull_request, post the preview URL back to the PR as a single sticky
      # comment (edited in place on each push) so the preview is one click from the PR.
      # The header keeps it apart from the Lighthouse comment, which the same bot posts.
      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: bench-preview
          message: "Bench preview for `${{ github.event.pull_request.head.sha }}`: ${{ steps.deploy.outputs.url }}"

      # Check the build commit, the read paths and CDN caching. Production is
      # probed on the public domain, and any failure fails the run. Previews sit
      # behind Vercel Authentication, so their verification reports as blocked.
      - name: Verify deployed build and read paths
        id: verify
        timeout-minutes: 4
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PROD_URL: ${{ vars.BENCH_SITE_BASE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          if [ "${TARGET}" = "production" ]; then
            node bench/scripts/verify-web-deploy.mjs "${PROD_URL}" "${EXPECTED_SHA}" production
          else
            node bench/scripts/verify-web-deploy.mjs "${DEPLOY_URL}" "${EXPECTED_SHA}" preview
          fi
