#
# External keep-warm / uptime ping for the deployed bench site. This is an EXTERNAL
# edge ping (from a GitHub-hosted runner) against the public production URL —
# DISTINCT from the in-app Vercel cron in `vercel.json` (`/bench/api/health`
# every 2 min, run inside Vercel's own scheduler). The external ping additionally
# exercises the public DNS + CDN-edge path the internal cron does not, and is
# independent of the Vercel cron quota. The target URL is `vars.BENCH_SITE_BASE_URL`;
# the job skips until it is set. Scheduled runs fire only on the default branch.
#
# Once the Vercel project sets `CRON_SECRET`, the health route runs its database
# check only for `Authorization: Bearer <CRON_SECRET>`, and answers any other
# caller with the build identity alone. The repository secret `BENCH_CRON_SECRET`
# holds the same value, so this ping keeps checking the database, and it fails
# unless the response reports `status: ok`: a wrong or stale secret gets the
# identity alone and fails the job. Without the secret the ping still reaches the
# function, but may not reach the database.

name: Bench Keep-Warm

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-keep-warm
  cancel-in-progress: true

jobs:
  ping:
    name: Ping production health endpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Curl health endpoint
        env:
          BASE_URL: ${{ vars.BENCH_SITE_BASE_URL }}
          CRON_SECRET: ${{ secrets.BENCH_CRON_SECRET }}
        run: |
          set -Eeuo pipefail
          if [ -z "${BASE_URL}" ]; then
            echo "BENCH_SITE_BASE_URL not set; skipping keep-warm ping" >&2
            exit 0
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::warning::BENCH_CRON_SECRET not set; the ping may not reach the database"
          fi
          # The header goes through stdin (`-H @-`), so the secret is never a
          # command-line argument.
          { [ -z "${CRON_SECRET}" ] || printf 'Authorization: Bearer %s\n' "${CRON_SECRET}"; } \
            | curl -fsS --max-time 30 --retry 2 -H @- "${BASE_URL%/}/api/health" \
              -o "${RUNNER_TEMP}/health.json"
          if [ -n "${CRON_SECRET}" ] && ! jq -e '.status == "ok"' "${RUNNER_TEMP}/health.json" >/dev/null; then
            echo "::error::The health check did not run the database check; is BENCH_CRON_SECRET the Vercel project's CRON_SECRET?"
            exit 1
          fi
          echo "keep-warm ping OK: ${BASE_URL%/}/api/health"
