#
# Check bench on each production deployment of the app. The `vortex` Vercel
# project builds and deploys the app (the marketing site and bench) through its
# git integration, which reports every deployment to GitHub. When a production
# deployment is ready, this runs scripts/verify-web-deploy.mjs against bench's
# paths under /bench on that deployment's own URL: the build commit in
# /api/health, a representative group and chart, and the landing and chart
# pages. It probes the deployment's URL, so it checks the deployment it was
# told about.
#
# The CDN check (a cache HIT on a repeated landing page and chart API request)
# runs on BENCH_SITE_BASE_URL, bench.vortex.dev, because production caches only
# that form of bench's pages: their HTML differs from the /bench form's. It runs
# only once bench.vortex.dev's /api/health reports this deployment's commit,
# and is skipped, with a notice, while the domain serves another deployment or
# project.
#
# A protected deployment URL needs Vercel's Protection Bypass for Automation:
# set its secret as the repository secret VERCEL_AUTOMATION_BYPASS_SECRET.
# Without it, a protected production URL fails the check.

name: Bench Verify Deploy

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: bench-verify-deploy-${{ github.event.deployment.id }}
  cancel-in-progress: false

jobs:
  verify:
    name: "Bench: verify production deploy"
    # Only Vercel's own production deployments, once they succeed. Vercel
    # names the environment "Production", or "Production – <project>" when a
    # repository has several projects.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.creator.login == 'vercel[bot]' &&
      startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Verify bench on the deployment
        timeout-minutes: 4
        env:
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
          EXPECTED_SHA: ${{ github.event.deployment.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # bench.vortex.dev, where the CDN check runs. Unset, the check is skipped.
          CDN_URL: ${{ vars.BENCH_SITE_BASE_URL }}
        run: |
          set -Eeuo pipefail
          [[ "${DEPLOY_URL}" == https://* ]] || { echo "::error::The deployment reported no HTTPS URL: '${DEPLOY_URL}'."; exit 1; }
          node scripts/verify-web-deploy.mjs "${DEPLOY_URL%/}/bench" "${EXPECTED_SHA}" production "${CDN_URL%/}"
