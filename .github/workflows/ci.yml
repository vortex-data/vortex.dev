name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same workflow + ref. Including
# `github.workflow` in the key keeps this from colliding with any other
# workflow that happens to share a ref-based group prefix.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: this workflow only reads the repo to lint/build/verify; it
# never writes back. Anything that needs write scopes lives in a separate
# workflow with its own scoped permissions.
permissions:
  contents: read

jobs:
  # Every check of the app, for both sites, on every change: lint and
  # format, the build, types, both test suites (bench's with its Postgres
  # integration tests in Docker), the migration-runner, infrastructure and
  # deploy-check tests, the endpoint checks and the browser tests. Lighthouse
  # and axe run on the pull request's Vercel preview (lighthouse.yml), where
  # bench has its database.
  ci:
    name: Lint, build, verify
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # The browser tests run in Microsoft's Playwright image, pinned by
      # digest, so no step runs apt. Renovate updates the tag and digest
      # together (customManagers in renovate.json) and groups them with
      # @playwright/test. The tag must name the installed @playwright/test
      # version: a step below checks it, and tests/unit/workflows.test.ts
      # checks that lighthouse.yml's axe job uses the same image.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-resolute@sha256:f76885029244e5a384243a930ff283cef67d90653978ee27a77dd4cff8882fb4
    steps:
      # Start the pull first, so it overlaps the install, the build and the
      # tests. A later step waits for it, and retries once if it failed. The
      # step shell runs with `set -e`, so the status is written in an && / ||
      # list: a failed pull must still write its status, or the wait step
      # would hang.
      - name: Start pulling the Playwright image
        run: |
          (timeout 180 docker pull -q "$PLAYWRIGHT_IMAGE" > /tmp/pull.log 2>&1 && echo 0 > /tmp/pull.status || echo 1 > /tmp/pull.status) &

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Static checks of the workflow files, before anything else runs. Both
      # images are pinned by digest, and Renovate updates them
      # (customManagers in renovate.json). actionlint checks syntax,
      # expressions and the inline shell (with shellcheck), and gets no
      # network. This actionlint release predates the ubuntu-26.04 runner
      # label, so that one message is ignored. zizmor audits for security
      # problems; it uses the job's read-only token to compare each action pin
      # with the action's repository. Justify a zizmor exception beside the
      # line it covers, as `# zizmor: ignore[audit-name] reason`.
      - name: Lint the workflows (actionlint)
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            "$ACTIONLINT_IMAGE" -color -ignore 'label "ubuntu-26.04" is unknown'

      - name: Audit the workflows (zizmor)
        env:
          ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e GH_TOKEN \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo \
            "$ZIZMOR_IMAGE" --no-progress --color=always .github/workflows .github/actions

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4

      # Bun is the package manager and script runner, but Next.js (and tsc)
      # run on Node. The runner image is pinned, but the Node
      # version inside it can still drift; pin via .nvmrc so a future
      # GitHub bump can't break the build silently.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      # Cache Bun's resolved package store keyed on the lockfile hash. Cuts
      # ~10s off `bun install` on a clean runner; the restore-key falls back
      # to any prior cache from this OS so partial hits still help.
      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Cache Next.js's incremental build output. Keyed on lockfile + commit
      # SHA so the exact-key match is always per-commit fresh; restore-keys
      # fall back to any previous build on the same lockfile, then any build
      # on this OS — so most CI runs hit a cache and skip rebuilding
      # unchanged webpack modules.
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Install
        id: install
        run: bun install --frozen-lockfile

      - name: Check the image matches @playwright/test
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          case "$PLAYWRIGHT_IMAGE" in
            *":v$version-"*) echo "Image and @playwright/test are both $version." ;;
            *)
              echo "::error::@playwright/test is $version, but PLAYWRIGHT_IMAGE is $PLAYWRIGHT_IMAGE. Update the image tag and digest in .github/workflows/ci.yml and lighthouse.yml."
              exit 1
              ;;
          esac

      - name: Lint + format check
        run: bun run check:ci

      # Build BEFORE typecheck: the build runs velite (populating .velite/
      # which the `#site/content` path alias resolves to) and produces
      # next-env.d.ts. tsc fails without these, so order matters here.
      - name: Build
        run: bun run build

      - name: Type check
        run: bun run typecheck

      # knip finds unused files, exports and dependencies. It runs after the
      # build for the same reason tsc does: it resolves `#site/content` to
      # .velite/, which the build writes.
      - name: Unused code and dependencies
        run: bun run knip

      - name: Unit tests
        run: bun run test

      - name: Test the parity check, the deploy check and the AI review gate
        run: |
          bun test scripts/parity/compare-api.test.ts
          node --test scripts/verify-web-deploy.test.mjs
          bun test scripts/ai-review-gate.test.ts

      - name: Check infrastructure trust policies offline
        run: |
          bash -n infra/provision.sh
          python3 -m unittest discover -s infra/tests -v

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      # uv has no lockfile here, so hold it to packages at least 7 days old,
      # as bunfig.toml holds Bun.
      - name: Set the uv cooldown
        run: echo "UV_EXCLUDE_NEWER=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"

      - name: Test the migration runner
        working-directory: db
        run: uv run --no-project --with 'psycopg[binary]>=3.2' python -m unittest discover -s tests -v

      # bench's Postgres integration suite starts Postgres in Docker
      # (testcontainers). With CI=true it fails rather than skips without it.
      - name: Require Docker for bench's integration suite
        run: docker info > /dev/null

      - name: bench tests
        run: bun run test:bench

      - name: Start server
        run: |
          bun run start > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start in 30s"
          cat /tmp/server.log
          exit 1

      - name: Verify endpoints
        run: bun run verify

      # Both pulls stop after 180 s; a normal pull finishes while the build
      # and tests run. The step timeout covers what is left of the first pull
      # plus the whole retry.
      - name: Wait for the Playwright image
        timeout-minutes: 7
        run: |
          while [ ! -f /tmp/pull.status ]; do sleep 1; done
          if [ "$(cat /tmp/pull.status)" != 0 ]; then
            cat /tmp/pull.log
            echo "::warning::The first pull of the Playwright image failed or took over 3 minutes. Trying once more."
            timeout 180 docker pull -q "$PLAYWRIGHT_IMAGE"
          fi

      # The axe specs need bench's database, so they run on the preview in
      # lighthouse.yml. The test runner runs in the image with the host
      # network, so it reaches the server on localhost. The runner's user
      # owns the files the tests write, and HOME points at a directory that
      # user can write.
      - name: Browser smoke tests
        id: browser-tests
        run: |
          docker run --rm --init --ipc=host --network=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CI -e GITHUB_ACTIONS -e BASE_URL=http://localhost:3000 \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "$PLAYWRIGHT_IMAGE" \
            node node_modules/@playwright/test/cli.js test --grep-invert @axe

      # The JSON report keeps each attempt and its duration, so it uploads on
      # success too. A failed test keeps its trace in test-results/.
      - name: Upload Playwright results
        if: always() && (steps.browser-tests.outcome == 'success' || steps.browser-tests.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-results-attempt-${{ github.run_attempt }}
          path: test-results/results.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-traces-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill "$(cat /tmp/server.pid)" 2>/dev/null || true
          fi

      - name: Server logs (on failure)
        if: failure()
        run: cat /tmp/server.log || true

      # Hard-gated, and it runs after a failed earlier step too, so every run
      # reports the advisory state. Resolve a new advisory with a direct
      # bump, an `overrides` entry in package.json, or, when no fix exists
      # yet, an `--ignore=GHSA-...` flag on this line with an entry in
      # package.json's `auditExceptions` (an `expires` time and a `reason`).
      # tests/unit/dated-exceptions.test.ts fails for a flag without an
      # entry, an entry without a flag, and an entry 7 days past its time.
      # See CLAUDE.md "Audit advisories".
      - name: Dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun audit

  # Runs only on PRs (no baseline diff to compute on a push to main).
  # Compares the PR's dependency manifest against main and flags
  # high-severity advisories or license incompatibilities. It complements
  # the `bun audit` step above: that step gates the whole locked tree, and
  # this review catches what the PR itself introduces (severity `high` and
  # above), with GitHub's advisory provenance.
  #
  # GitHub's dependency graph does not read bun.lock. The dependency-snapshot
  # workflow submits it, and the action would pass without it, so a guard
  # runs first (see its comment). The retry inputs then cover the short time
  # GitHub takes to process a submitted snapshot. `fail-on-scopes` stays at
  # the action's default, `runtime`: a development-only advisory does not
  # fail this review. The `bun audit` step gates the whole tree, development
  # packages included.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Implies read, which the guard uses to list a fork's changed files.
      pull-requests: write
      # The guard reads the snapshot job's check run.
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The action reviews whatever graph it finds. If the snapshot job
      # failed, was skipped or finished late, that graph lacks bun.lock's
      # packages and the review passes without them. So: for a pull request
      # from this repository, wait for that job on the head commit and fail
      # unless it succeeded. A fork's pull request gets no snapshot (its token
      # cannot submit one), so fail it if it changes a bun.lock; if it does
      # not, it adds no locked package.
      - name: Require the bun.lock snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          # The `name:` of the job in dependency-snapshot.yml.
          SNAPSHOT_CHECK: Submit bun.lock
          WAIT_SECONDS: 600
        run: |
          if [ "$FROM_FORK" = true ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
            # The API lists at most 3000 files; a longer pull request could hide a bun.lock.
            listed=$(grep -c . <<<"$files" || true)
            if [ "$listed" -lt "$CHANGED_FILES" ]; then
              echo "::error::Listed $listed of the pull request's $CHANGED_FILES changed files, so a bun.lock change could go unseen."
              exit 1
            fi
            if grep -Eq '(^|/)bun\.lock$' <<<"$files"; then
              echo "::error::This pull request comes from a fork and changes bun.lock. A fork gets no dependency snapshot, so dependency review cannot see the locked packages. Make the lock change from a branch in this repository."
              exit 1
            fi
            echo "Fork pull request without a bun.lock change: it adds no locked package."
            exit 0
          fi

          name=$(jq -rn --arg name "$SNAPSHOT_CHECK" '$name | @uri')
          deadline=$((SECONDS + WAIT_SECONDS))
          while :; do
            # The newest run of the job (highest id), so a successful rerun counts.
            if run=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=$name&per_page=100" \
              --jq '(.check_runs | max_by(.id)) // {} | "\(.status // "missing") \(.conclusion // "none")"'); then
              read -r status conclusion <<<"$run"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "The '$SNAPSHOT_CHECK' job submitted the snapshot for $HEAD_SHA."
                  exit 0
                fi
                echo "::error::The '$SNAPSHOT_CHECK' job concluded '$conclusion', so dependency review would not see bun.lock's packages. Rerun it, then rerun this job."
                exit 1
              fi
              echo "'$SNAPSHOT_CHECK' on $HEAD_SHA: $status"
            else
              echo "::warning::Could not read the check runs of $HEAD_SHA; trying again."
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The '$SNAPSHOT_CHECK' job did not finish on $HEAD_SHA within $WAIT_SECONDS seconds."
              exit 1
            fi
            sleep 15
          done

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300

  # Defense-in-depth on top of GitHub's push protection. Push protection
  # covers high-entropy / known-provider patterns at push time; TruffleHog
  # re-scans diffs on PRs + push to main, catching secrets that slipped
  # past push protection (low-entropy formats, detector patterns added
  # after the secret was committed, or push-protection bypass via the
  # "I'll fix it later" allow path).
  secret-scan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # TruffleHog diffs base..head and needs the full history present.
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2  # v3.99.7
        with:
          # On PRs: scan the diff between base and head. On push to main:
          # scan the previous commit to HEAD. The action infers both from
          # the event context.
          # --results=verified,unknown drops trufflehog's "unverified" tier
          # (pattern-matched but couldn't reach the verifier endpoint) to
          # keep noise down without losing coverage of secrets whose
          # verifiers don't recognize them yet.
          extra_args: --results=verified,unknown

  # Keeps every file's license machine-readable, per section 7.d of the
  # Vortex Technical Charter. REUSE.toml maps code to Apache-2.0 and docs to
  # CC-BY-4.0; a file it doesn't cover (usually a new image or other asset)
  # fails here until it's annotated. The action builds from the floating
  # `fsfe/reuse:6` image tag, so the job gets no secrets and checkout doesn't
  # persist the read-only token into the workspace the container mounts.
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: REUSE lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5  # v6.0.0
