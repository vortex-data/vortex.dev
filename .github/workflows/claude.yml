name: Claude

# Responds to @claude mentions in issues, PR descriptions, comments, and reviews.
# Claude reads the surrounding context, can push commits to the PR branch, and
# replies inline.
#
# Required setup (one-time):
#   - Repo secret ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN) — set in
#     Settings → Secrets and variables → Actions.
#   - The GitHub App "Claude" installed on the repo, OR the default
#     GITHUB_TOKEN with the permissions block below.

on:
  # zizmor: ignore[dangerous-triggers] Comments are the purpose of this workflow. This event runs the workflow file and the checkout from the default branch, and the job's `if` limits who can start it.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Nothing by default; the job below asks for exactly what it uses.
permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Run Claude
    # Only the repository's owners, members, and collaborators can start it.
    # The action also refuses an actor without write access, but the job
    # holds write tokens, so it should not start for anyone else at all.
    # An `assigned` event's actor is whoever assigned the issue, which needs
    # triage access; `issue.author_association` describes the issue's author,
    # so only `opened` checks it.
    #
    # Nothing that Renovate opened. Its pull requests carry upstream release
    # notes, need no review, and auto-merge when the required checks pass, so
    # a commit that Claude pushed to a Renovate branch would merge without a
    # person. `issue_comment` covers issues and pull requests; `issue.user`
    # is the author of either.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.issue.user.login != 'renovate[bot]') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.pull_request.user.login != 'renovate[bot]') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        github.event.pull_request.user.login != 'renovate[bot]') ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        github.event.issue.user.login != 'renovate[bot]' &&
        (github.event.action == 'assigned' ||
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # zizmor: ignore[artipacked] The pinned Claude action fetches the PR branch before it configures Git authentication.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The initial PR fetch needs checkout authentication. Both steps use
          # the same job token. Checkout removes its credential after the job.
          persist-credentials: true

      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
