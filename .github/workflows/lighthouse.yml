name: Lighthouse

# Lighthouse and axe for both sites, on each pull request's Vercel preview.
# bench renders from its database, which only a deployment has, so the jobs
# audit the site and bench together there, instead of a local build.
#
# Each page gets its own Lighthouse job, and axe runs in another, all at the
# same time. They can't share a runner: a second audit or browser on the same
# CPU would skew Lighthouse's timings. The `report` job, the required check
# "Lighthouse and axe", collects their results.
on:
  pull_request:
  # Baseline: a manual run on a branch with a Vercel preview, such as an open
  # PR's branch. It audits every page on both profiles with more runs, asserts
  # nothing, and posts no comment; the run's summary shows each page's
  # scores and metric values, to calibrate the floors in lighthouserc.cjs.
  # Its check is named "Lighthouse baseline", so it never stands in for the
  # required "Lighthouse and axe".
  workflow_dispatch:
    inputs:
      runs:
        description: Lighthouse runs for each page and profile
        type: number
        default: 5

permissions:
  contents: read

# Including `github.workflow` in the key keeps this from colliding with any
# other workflow that happens to share a ref-based group prefix.
concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROXY: http://127.0.0.1:3201

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.page }}, ${{ matrix.profile }})
    # Fork PRs and Dependabot's PRs get no secrets, so they can't reach the
    # protected preview. The jobs are skipped for them, which counts as
    # passing for the required check.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    strategy:
      fail-fast: false
      # The keys of `pages` and `policy` in lighthouserc.cjs;
      # tests/unit/lighthouse-scores.test.ts keeps them equal.
      matrix:
        page: [home, blog, post, bench, chart]
        profile: [desktop, mobile]
    steps:
      # The PR's head commit, which Vercel built the preview from, not the
      # merge commit a pull_request checkout defaults to: the config must
      # describe the app it audits (a post only on main would be a 404). A
      # baseline audits the branch's head commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The proxy and lighthouserc.cjs use only Node's built-in modules, so
      # this job needs no `bun install`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      # zizmor's self-repository audit suggests a newer `$/` syntax. The `./`
      # form loads the action from the workspace, which this job's first
      # step checks out at the PR's head commit, the commit this workflow
      # file comes from, and no earlier step writes to `.github/actions`.
      - uses: ./.github/actions/preview-proxy  # zizmor: ignore[self-repository]
        with:
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      # Request the page once, so no Lighthouse run measures a cold start.
      # The chart job audits the first chart bench lists, and finds none on
      # a database with no charts.
      - name: Pick the page and warm it
        id: page
        env:
          PAGE: ${{ matrix.page }}
        run: |
          path="$(node -p "require('./lighthouserc.cjs').pages['${PAGE}'] ?? ''")"
          if [ "${PAGE}" = chart ]; then
            slug="$(curl -sf "${PROXY}/bench/api/groups" \
              | jq -r '[.groups[] | select(.charts | length > 0)][0].charts[0].slug // empty')"
            if [ -z "${slug}" ]; then
              echo "::notice::bench lists no charts, so there is no chart page to audit."
              exit 0
            fi
            echo "chart=/chart/${slug}" >> "$GITHUB_OUTPUT"
            path="/bench/chart/${slug}"
          fi
          if [ -z "${path}" ]; then
            echo "::notice::There is no ${PAGE} page to audit."
            exit 0
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          curl -s -o /dev/null -w "%{http_code} %{time_total}s ${path}\n" "${PROXY}${path}"

      # The action runs Lighthouse against the page, asserts the thresholds
      # and writes the reports to .lighthouseci/. They stay out of
      # Lighthouse's public report storage, because the pages come from the
      # protected preview. Threshold rationale lives in lighthouserc.cjs.
      - name: Lighthouse CI
        if: steps.page.outputs.path != ''
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12
        env:
          BASE_URL: ${{ env.PROXY }}
          LHCI_PAGE: ${{ matrix.page }}
          LHCI_PROFILE: ${{ matrix.profile }}
          BENCH_CHART_PATH: ${{ steps.page.outputs.chart }}
          LHCI_RUNS: ${{ inputs.runs || 3 }}
          LHCI_BASELINE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: false

      # The full reports hold screenshots and page details of the protected
      # preview, and anyone signed in to GitHub can download a public
      # repository's artifacts, so they stay on the runner. This step checks
      # that each report is an audit of the page on this job's profile, and
      # keeps only its scores, metric values and the IDs of its failed
      # audits, which it also prints. See scripts/lighthouse-scores.mjs.
      - name: Check the reports and keep the scores
        if: always() && steps.page.outputs.path != ''
        env:
          BASE_URL: ${{ env.PROXY }}
          LHCI_PAGE: ${{ matrix.page }}
          LHCI_PROFILE: ${{ matrix.profile }}
          BENCH_CHART_PATH: ${{ steps.page.outputs.chart }}
          LHCI_RUNS: ${{ inputs.runs || 3 }}
        run: node scripts/lighthouse-scores.mjs keep "${RUNNER_TEMP}/lighthouse-scores"

      # Uploaded when the assertions fail too.
      - name: Upload the scores
        if: always() && steps.page.outputs.path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lighthouse-${{ matrix.page }}-${{ matrix.profile }}
          path: ${{ runner.temp }}/lighthouse-scores/
          if-no-files-found: ignore
          retention-days: 7

  axe:
    name: axe
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    env:
      # The same image as ci.yml's browser tests; tests/unit/workflows.test.ts
      # keeps the two equal. See ci.yml for how Renovate updates it.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-resolute@sha256:f76885029244e5a384243a930ff283cef67d90653978ee27a77dd4cff8882fb4
    steps:
      # Start the pull first, so it overlaps the install and the wait for the
      # preview. See ci.yml's step of the same name.
      - name: Start pulling the Playwright image
        run: |
          (timeout 180 docker pull -q "$PLAYWRIGHT_IMAGE" > /tmp/pull.log 2>&1 && echo 0 > /tmp/pull.status || echo 1 > /tmp/pull.status) &

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.4

      # Bun is the package manager and script runner; the proxy and
      # Playwright run on Node, pinned by .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      # zizmor's self-repository audit suggests a newer `$/` syntax. The `./`
      # form loads the action from the workspace, which this job's first
      # step checks out at the PR's head commit, the commit this workflow
      # file comes from, and no earlier step writes to `.github/actions`.
      - uses: ./.github/actions/preview-proxy  # zizmor: ignore[self-repository]
        with:
          sha: ${{ github.event.pull_request.head.sha }}
          bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Check the image matches @playwright/test
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          case "$PLAYWRIGHT_IMAGE" in
            *":v$version-"*) echo "Image and @playwright/test are both $version." ;;
            *)
              echo "::error::@playwright/test is $version, but PLAYWRIGHT_IMAGE is $PLAYWRIGHT_IMAGE. Update the image tag and digest in .github/workflows/ci.yml and lighthouse.yml."
              exit 1
              ;;
          esac

      - name: Wait for the Playwright image
        timeout-minutes: 7
        run: |
          while [ ! -f /tmp/pull.status ]; do sleep 1; done
          if [ "$(cat /tmp/pull.status)" != 0 ]; then
            cat /tmp/pull.log
            echo "::warning::The first pull of the Playwright image failed or took over 3 minutes. Trying once more."
            timeout 180 docker pull -q "$PLAYWRIGHT_IMAGE"
          fi

      # playwright.config.ts runs one test at a time, for the smoke tests
      # against the local server in ci.yml. The preview has no such limit, so
      # axe uses the runner's four CPUs. The test runner runs in the image
      # with the host network, so it reaches the proxy on 127.0.0.1. The
      # bypass secret is not in this step's environment.
      - name: axe
        id: axe
        run: |
          docker run --rm --init --ipc=host --network=host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CI -e GITHUB_ACTIONS \
            -e BASE_URL="${PROXY}" -e BENCH_URL="${PROXY}/bench" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            "$PLAYWRIGHT_IMAGE" \
            node node_modules/@playwright/test/cli.js test --grep @axe --workers=4

      # The JSON report keeps each attempt and its duration, so it uploads on
      # success too. A failed test keeps its trace in test-results/.
      - name: Upload Playwright results
        if: always() && (steps.axe.outcome == 'success' || steps.axe.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: axe-results-attempt-${{ github.run_attempt }}
          path: test-results/results.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-traces-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7

  # The required check. It runs when a job above fails, so the comment still
  # shows which page regressed, and it fails unless every job above passed.
  # It is skipped with them for fork and Dependabot PRs.
  report:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Lighthouse baseline' || 'Lighthouse and axe' }}
    needs: [lighthouse, axe]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/lighthouse-comment.sh
            scripts/lighthouse-scores.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: lighthouse-*
          path: reports

      # Each page and profile's scores and metric values, across its runs.
      - name: Summarize the runs
        continue-on-error: true
        run: |
          shopt -s nullglob
          reports=(reports/*/lhr-*.json)
          if [ "${#reports[@]}" -eq 0 ]; then exit 0; fi
          node scripts/lighthouse-scores.mjs summary "${reports[@]}" >> "$GITHUB_STEP_SUMMARY"

      # A failed comment must not fail this required check, so both comment
      # steps are non-fatal.
      - name: Format PR comment
        id: lh-comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          shopt -s nullglob
          reports=(reports/*/lhr-*.json)
          if [ "${#reports[@]}" -eq 0 ]; then exit 0; fi
          {
            echo 'body<<COMMENT_EOF'
            scripts/lighthouse-comment.sh 'Lighthouse audit' "${reports[@]}"
            echo 'COMMENT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: steps.lh-comment.outputs.body != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: lighthouse
          message: ${{ steps.lh-comment.outputs.body }}

      # A baseline skips axe.
      - name: Require every job to pass
        env:
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
          AXE: ${{ needs.axe.result }}
          BASELINE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Lighthouse: ${LIGHTHOUSE}, axe: ${AXE}"
          [ "${LIGHTHOUSE}" = success ] && { [ "${AXE}" = success ] || [ "${BASELINE}" = true ]; }
