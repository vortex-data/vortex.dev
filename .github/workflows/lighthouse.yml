name: Lighthouse

# Lighthouse and axe for both sites, on each pull request's Vercel preview.
# bench renders from its database, which only a deployment has, so one job
# audits the site and bench together there, instead of a local build.
on:
  pull_request:

permissions:
  contents: read

# Including `github.workflow` in the key keeps this from colliding with any
# other workflow that happens to share a ref-based group prefix.
concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Lighthouse and axe
    # Fork PRs and Dependabot's PRs get no secrets, so they can't reach the
    # protected preview. The job is skipped for them, which counts as passing
    # for this required check.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      deployments: read
      pull-requests: write
    env:
      PROXY: http://127.0.0.1:3201
    steps:
      # The PR's head commit, which Vercel built the preview from, not the
      # merge commit a pull_request checkout defaults to: the config and specs
      # must describe the app they audit (a post only on main would be a 404).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.3

      # Bun is the package manager and script runner; the proxy, lhci and
      # Playwright run on Node, pinned by .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      # Vercel's git integration records the preview of each commit as a
      # GitHub deployment in the "Preview" environment, and its success status
      # holds the preview's URL. A build takes a few minutes.
      - name: Wait for the Vercel preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          deployments="repos/${GITHUB_REPOSITORY}/deployments"
          for _ in $(seq 1 80); do
            id="$(gh api "${deployments}?sha=${SHA}&environment=Preview" \
              --jq 'map(select(.creator.login == "vercel[bot]"))[0].id // empty')"
            if [ -n "${id}" ]; then
              read -r state url < <(gh api "${deployments}/${id}/statuses" \
                --jq '.[0] | "\(.state) \(.environment_url // "")"')
              case "${state}" in
                success)
                  echo "Preview: ${url}"
                  echo "url=${url}" >> "$GITHUB_OUTPUT"
                  exit 0 ;;
                failure | error)
                  echo "::error::The Vercel preview of ${SHA} failed."
                  exit 1 ;;
              esac
            fi
            sleep 15
          done
          echo "::error::No Vercel preview of ${SHA} after 20 minutes."
          exit 1

      # The proxy holds the bypass secret and adds it only to requests for the
      # preview; see scripts/preview-proxy.mjs.
      - name: Start the preview proxy
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          node scripts/preview-proxy.mjs "${PROXY##*:}" "${PREVIEW_URL}" &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null "${PROXY}/bench/api/health"; then exit 0; fi
            sleep 1
          done
          echo "::error::bench's health check failed through the proxy."
          curl -s "${PROXY}/bench/api/health" | head -c 500
          exit 1

      # Request each page once, so no Lighthouse run measures a cold start.
      - name: Pick a chart page and warm the preview
        id: chart
        run: |
          slug="$(curl -sf "${PROXY}/bench/api/groups" \
            | jq -r '[.groups[] | select(.charts | length > 0)][0].charts[0].slug // empty')"
          if [ -n "${slug}" ]; then echo "path=/chart/${slug}" >> "$GITHUB_OUTPUT"; fi
          for path in / /blog /bench ${slug:+/bench/chart/${slug}}; do
            curl -s -o /dev/null -w "%{http_code} %{time_total}s ${path}\n" "${PROXY}${path}"
          done

      # The action runs Lighthouse against each URL in lighthouserc.cjs,
      # asserts the thresholds and uploads the reports to temporary public
      # storage. Threshold rationale lives in lighthouserc.cjs.
      - name: Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12
        env:
          BASE_URL: ${{ env.PROXY }}
          BENCH_CHART_PATH: ${{ steps.chart.outputs.path }}
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true

      # A failed comment must not fail this required check, so both comment
      # steps are non-fatal. `if: always()` so the comment still posts when
      # assertions fail, and reviewers can see which category regressed.
      - name: Format PR comment
        if: always() && steps.lighthouse.outputs.links != ''
        id: lh-comment
        continue-on-error: true
        env:
          LINKS_JSON: ${{ steps.lighthouse.outputs.links }}
        run: |
          {
            echo 'body<<COMMENT_EOF'
            scripts/lighthouse-comment.sh 'Lighthouse audit'
            echo 'COMMENT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: always() && steps.lh-comment.outputs.body != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: lighthouse
          message: ${{ steps.lh-comment.outputs.body }}

      # The same browsers as the smoke tests in ci.yml, from the same cache,
      # keyed on the installed Playwright version and the runner image.
      - name: Get Playwright version
        if: always() && steps.chart.outcome == 'success'
        id: playwright-version
        run: |
          VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: always() && steps.chart.outcome == 'success'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ steps.playwright-version.outputs.image }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: always() && steps.chart.outcome == 'success'
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "${CACHE_HIT}" = "true" ]; then
            bunx playwright install-deps chromium webkit
          else
            bunx playwright install --with-deps chromium webkit
          fi

      # `if: always()` so axe still runs when a Lighthouse assertion fails.
      - name: axe
        if: always() && steps.chart.outcome == 'success'
        env:
          BASE_URL: ${{ env.PROXY }}
          BENCH_URL: ${{ env.PROXY }}/bench
        run: bunx playwright test --grep @axe

      # In CI, playwright.config.ts uses only the `github` reporter, so there
      # is no HTML report; a failed test keeps its trace in test-results/.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
