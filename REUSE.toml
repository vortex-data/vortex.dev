# The fonts the post Open Graph images set their text in (src/lib/og.tsx). They are the design
# system's Funnel Display and Geist Mono, as Google Fonts distributes them, under the SIL Open
# Font License. next/og cannot read the woff2 files next/font serves. The Geist Mono file has its
# GSUB table removed, because next/og's font parser cannot read its contextual alternates. The
# licence allows a modified version, and the font names no Reserved Font Name.
[[annotations]]
path = "src/lib/og-assets/FunnelDisplay-Medium.ttf"
SPDX-FileCopyrightText = "2024 The Funnel Project Authors (https://github.com/Dicotype/Funnel)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "src/lib/og-assets/GeistMono-Regular.ttf"
SPDX-FileCopyrightText = "2024 The Geist Project Authors (https://github.com/vercel/geist-font.git)"
SPDX-License-Identifier = "OFL-1.1"
