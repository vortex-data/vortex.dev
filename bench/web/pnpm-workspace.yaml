allowBuilds:
  # testcontainers reaches the local Docker daemon over the unix socket via
  # dockerode; ssh2 (and its optional cpu-features perf addon) is only needed
  # for remote SSH Docker hosts, and protobufjs's postinstall is a CLI codegen
  # step. None are required at runtime, so skip their native builds.
  cpu-features: false
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: true
# Refuse to resolve package versions younger than 14 days (the value is in
# minutes). Mirrors `minimumReleaseAge` in the root bunfig.toml and
# renovate.json, so a local `pnpm add` or lockfile refresh can't pull a freshly
# published, possibly compromised version.
minimumReleaseAge: 20160
# Cooldown exemptions, approved on 2026-10-28 to move bench off vulnerable
# releases before their fixes were 14 days old. Each entry is an exact version,
# so it covers that one release. Remove this list after 2026-10-29 14:18 UTC,
# when every version here is past the window.
minimumReleaseAgeExclude:
  # next 15.5.28 fixes GHSA-2464-fhr4-w9xw (critical) and GHSA-p3m5-59mp-jv5r.
  - next@15.5.28
  - eslint-config-next@15.5.28
  - "@next/env@15.5.28"
  - "@next/eslint-plugin-next@15.5.28"
  - "@next/swc-darwin-arm64@15.5.28"
  - "@next/swc-darwin-x64@15.5.28"
  - "@next/swc-linux-arm64-gnu@15.5.28"
  - "@next/swc-linux-arm64-musl@15.5.28"
  - "@next/swc-linux-x64-gnu@15.5.28"
  - "@next/swc-linux-x64-musl@15.5.28"
  - "@next/swc-win32-arm64-msvc@15.5.28"
  - "@next/swc-win32-x64-msvc@15.5.28"
  # undici 7.30.1 fixes the remaining dev-only advisories (via testcontainers and jsdom).
  - undici@7.30.1
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
# Force patched versions of transitive dependencies whose parents don't allow
# them yet. Drop an entry once its parent's own range reaches the patch.
overrides:
  # next pins postcss 8.4.31 exactly (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849).
  postcss: ^8.5.30
  # next accepts ^0.34.3 || ^0.35.4, so pnpm keeps a vulnerable 0.34.x
  # (GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c, GHSA-wq5f-xc86-pv6w).
  sharp: ^0.35.5
