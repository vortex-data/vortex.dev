# Bun configuration. Project-scoped — Bun merges this with $HOME/.bunfig.toml.

[install]
# Link only the dependencies each package declares, instead of hoisting every
# package to the top of node_modules: no code can load a transitive
# dependency that its own package does not declare. bench was installed this
# way before it joined the root package; Bun's default for a single package
# is to hoist, so the setting keeps the layout.
linker = "isolated"

# Refuse to install package versions younger than 7 days. Mirrors the
# Renovate minimumReleaseAge in renovate.json so a local `bun install`,
# `bun add`, `bun update`, or a Vercel build can't pull a freshly
# published (and potentially compromised) version that Renovate would
# have held back.
#
# The window matters because npm worms (Shai-Hulud, mini-Shai-Hulud, the
# May 2026 TanStack incident, the autumn 2026 waves) propagate, get
# detected, and get yanked within minutes to hours; 7 days leaves a wide
# margin for those events to have surfaced. Renovate's security updates
# skip its own wait; if such a fix is younger than this window, allowlist
# it in minimumReleaseAgeExcludes until the window passes.
#
# Units: seconds. 7 * 86400 = 604800.
minimumReleaseAge = 604800
