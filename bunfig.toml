# Bun configuration. Project-scoped — Bun merges this with $HOME/.bunfig.toml.

[install]
# Give every package its own resolved dependencies, as pnpm did for bench,
# instead of one hoisted tree. The site and bench/web each pin their own
# Next.js, React and TypeScript; in a hoisted tree bench's tools would load
# the site's copies (typescript-eslint would get TypeScript 7). This is also
# Bun's default for a workspace.
linker = "isolated"
# bench's ESLint config loads its plugins from bench/web, so packages named
# like ESLint or Prettier also go in the root node_modules, where pnpm's
# default public-hoist-pattern put them for bench. Drop this when bench stops
# using ESLint and Prettier.
publicHoistPattern = ["*eslint*", "*prettier*"]

# Refuse to install package versions younger than 14 days. Mirrors the
# Renovate minimumReleaseAge in renovate.json so a local `bun install`,
# `bun add`, `bun update`, or a Vercel build can't pull a freshly
# published (and potentially compromised) version that Renovate would
# have held back.
#
# The window matters because npm worms (Shai-Hulud, mini-Shai-Hulud, the
# May 2026 TanStack incident) propagate, get detected, and get yanked
# within hours-to-days; 14 days is the observed safe horizon for those
# events to have surfaced.
#
# Units: seconds. 14 * 86400 = 1209600.
minimumReleaseAge = 1209600

# Security fixes newer than the 14-day window. Each entry exempts the whole
# package, so remove it once its pinned version is older than 14 days.
#
# - next 16.4.1 (2026-10-15) fixes GHSA-2464-fhr4-w9xw and GHSA-673q-mjm6-r5xr
#   (critical RCE) and GHSA-p3m5-59mp-jv5r (high DoS). Next pins its @next/*
#   packages to the same version, so they need the same exemption.
# - react / react-dom 19.3.1 (2026-10-14) harden the Server Components transport.
#   React shipped the change on every supported line at once (19.0.9, 19.1.10,
#   19.2.9).
# - undici 7.30.1 and 8.12.2 (2026-10-15 14:18 and 15:05 UTC) fix the dev-only
#   advisories that reach bench through testcontainers (7.x) and jsdom (8.x).
#   8.12.1, the newest 8.x past the window, has four high advisories
#   (GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm,
#   GHSA-xjj6-f33q-929c). The lockfile pins 8.12.2, not the newer 8.12.3 this
#   exemption would also allow. Only bench uses undici.
#
# Remove all entries after 2026-10-29 15:06 UTC.
minimumReleaseAgeExcludes = [
  "next",
  "@next/env",
  "@next/swc-darwin-arm64",
  "@next/swc-darwin-x64",
  "@next/swc-linux-arm64-gnu",
  "@next/swc-linux-arm64-musl",
  "@next/swc-linux-x64-gnu",
  "@next/swc-linux-x64-musl",
  "@next/swc-win32-arm64-msvc",
  "@next/swc-win32-x64-msvc",
  "react",
  "react-dom",
  "undici",
]
